name: mirror

# The Worker deployment carries its own copy of this repository's name in
# `GITHUB_REPO`, and it reads `r/` from that repository at request time. Rename
# the repository and the deployment keeps serving the old one: its indexes stop
# where the rename happened, the artifacts they name 404, and every device on
# that mirror fails while `r/` here is healthy. Nothing in this repository can
# notice, so `drift` asks the live mirror every day, and `deploy` pushes
# `mirror/` changes out instead of waiting for someone to remember.

on:
  push:
    branches: [main]
    paths:
      - "mirror/**"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: mirror-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Mirror worker tests
        run: node --test mirror/worker.test.mjs

      - name: Deploy the worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID unset; deploy skipped"
            exit 0
          fi
          npx --yes wrangler@4 deploy --config mirror/wrangler.toml

  drift:
    # Runs after a deploy when there is one, and on its own from the schedule:
    # a deployment that is already stale has no code change to trigger it.
    needs: deploy
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: The mirror must be this repository, and current
        env:
          MIRROR: ${{ vars.PICA_MIRROR_URL || 'https://pica-nest.miaoer.net' }}
        run: |
          set -euo pipefail
          if python3 -m ci.nest mirror --url "$MIRROR" --repo "${{ github.repository }}"; then
            exit 0
          fi
          # The worker caches indexes for 60 s, so a mismatch right after a
          # publish is expected. Ask again before failing the run.
          echo "::warning::mismatch on the first read; the worker caches indexes for 60 s, retrying"
          sleep 70
          python3 -m ci.nest mirror --url "$MIRROR" --repo "${{ github.repository }}"
