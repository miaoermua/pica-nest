name: Pica Package Build and Release

on:
  push:
    paths:
      - 'src/**'
      - 'ci/**'
      - 'schema/**'
      - '.github/scripts/**'
  schedule:
    # Cron: every day at 04:17 UTC. Upstream releases are picked up without a push.
    - cron: '17 4* * *'
  workflow_dispatch:
    inputs:
      force_rebuild_all:
        description: 'Force fully rebuild all packages'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # needed for tj-actions/changed-files

      - name: Get Changed Files in src/
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: src/**
          dir_names: true
          dir_names_max_depth: 3 # e.g. src/mgr/hello
          
      - name: Checkout pica source
        uses: actions/checkout@v4
        with:
          repository: miaoermua/pica
          path: pica-source

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build and Install pica-pack
        run: |
          echo "Compiling pica-pack from miaoermua/pica..."
          cd pica-source
          cargo build --release --bin pica-pack
          sudo mv target/release/pica-pack /usr/local/bin/pica-pack

      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema

      - name: Validate repository configuration
        run: |
          # Catches bad mgr/targets/include_dirs before a build wastes time.
          python3 .github/scripts/validate_repo.py

      - name: Build Changed Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p build_output

          if [ "${{ github.event_name }}" == "schedule" ] || [ "${{ github.event.inputs.force_rebuild_all }}" == "true" ]; then
            echo "Rebuilding all packages..."
            DIRS_TO_BUILD=$(find src -type f -name manifest | sed 's|/manifest||')
          else
            DIRS_TO_BUILD="${{ steps.changed-files.outputs.all_changed_files }}"
            if [ -z "$DIRS_TO_BUILD" ]; then
              echo "No files changed in src/. Skipping build."
            fi
          fi

          for dir in $DIRS_TO_BUILD; do
            if [ ! -f "$dir/manifest" ]; then
              continue
            fi
            # src/<mgr>/<id>/ -> build.json sits at ci/<mgr>/<id>/build.json
            PKG_ID=$(basename "$dir")
            BUILD_JSON="ci/$(basename "$(dirname "$dir")")/$PKG_ID/build.json"

            if [ -f "$BUILD_JSON" ]; then
              echo "Fetching assets for $PKG_ID using $BUILD_JSON..."
              python3 .github/scripts/fetch_assets.py "$dir" "$BUILD_JSON"
            fi

            echo "Building package in $dir..."
            # pica-pack reads `targets` from the manifest; the directory decides
            # nothing, and every backend it declares is built.
            pica-pack build "$dir" --outdir build_output
          done

      - name: Generate Repository Index
        run: |
          # Ensure r/ exists
          mkdir -p r
          # pica-pack writes one repo.json per backend under build_output/<backend>/.
          # gen_repo_index.py merges them into r/repo.json and copies artifacts
          # to r/packages/ where `pica -S` looks for them.
          if ls build_output/*/repo.json > /dev/null 2>&1; then
            python3 .github/scripts/gen_repo_index.py build_output/*/repo.json
          else
            echo "No packages were built."
          fi

      - name: Validate generated index
        run: python3 .github/scripts/validate_repo.py --quiet

      - name: Generate Release Tag
        id: date
        run: echo "RELEASE_TAG=$(date +'%y-%m-%d-%H-%M-%S')" >> $GITHUB_ENV

      - name: Create Snapshot Release
        uses: softprops/action-gh-release@v2
        if: success() && hashFiles('r/packages/*.pkg.tar.gz') != ''
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          files: r/packages/*.pkg.tar.gz

      - name: Update Rolling Latest Release
        uses: softprops/action-gh-release@v2
        if: success() && hashFiles('r/packages/*.pkg.tar.gz') != ''
        with:
          tag_name: latest
          name: Latest Packages
          files: r/packages/*.pkg.tar.gz

      - name: Commit generated index and artifacts
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add r/repo.json r/packages
          if git diff --staged --quiet; then
            echo "No changes to r/ to commit."
          else
            git commit -m "chore: auto-update r/repo.json and r/packages [skip ci]"
            git push origin $GITHUB_REF_NAME
          fi
