name: Pica Package Build and Release

on:
  push:
    paths:
      - 'src/**'
      - 'ci/**'
      - 'schema/**'
      - '.github/scripts/**'
      - '.github/workflows/**'
  schedule:
    # Cron: every day at 04:17 UTC. Upstream releases are picked up without a push.
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      force_rebuild_all:
        description: 'Force fully rebuild all packages'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # The change range is computed from event.before, which may be several
          # commits back; a shallow clone cannot resolve it.
          fetch-depth: 0

      - name: Detect changed packages
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild_all }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            python3 .github/scripts/changed_packages.py \
              --force-rebuild-all --github-output "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$FORCE_REBUILD" = "true" ]; then
              python3 .github/scripts/changed_packages.py \
                --force-rebuild-all --github-output "$GITHUB_OUTPUT"
            else
              # A manual run has no reliable diff range; validate globally
              # instead of silently rebuilding nothing.
              python3 .github/scripts/changed_packages.py \
                --full-validation-only --github-output "$GITHUB_OUTPUT"
            fi
          else
            python3 .github/scripts/changed_packages.py \
              --base "$BEFORE_SHA" --head "$HEAD_SHA" \
              --github-output "$GITHUB_OUTPUT"
          fi
      - name: Checkout pica source
        uses: actions/checkout@v4
        with:
          repository: miaoermua/pica
          # TEMPORARY: pica 0.3.33 (scripts/ layout, explicit -opkg/-apk/-pica
          # suffixes) is on the `apk` branch. `main` is still 0.3.0 and its
          # packer requires a `cmd/` directory that this repository no longer
          # has. Drop this ref once 0.3.33 is merged to main.
          ref: apk
          path: pica-source

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build and Install pica-pack
        run: |
          echo "Compiling pica-pack from miaoermua/pica..."
          cd pica-source
          cargo build --release --bin pica-pack
          sudo mv target/release/pica-pack /usr/local/bin/pica-pack

      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema

      - name: Test change detection mapping
        run: python3 .github/scripts/test_changed_packages.py

      - name: Test asset source mapping
        run: python3 .github/scripts/test_fetch_assets.py

      - name: Validate repository configuration
        run: |
          # Catches bad mgr/targets/include_dirs before a build wastes time.
          python3 .github/scripts/validate_repo.py

      - name: Full validation (shared CI inputs changed)
        if: steps.detect.outputs.full_validation == 'true'
        run: |
          # A schema, workflow or script change invalidates every job's
          # assumptions; validate them all without repackaging everything.
          python3 -m py_compile .github/scripts/*.py
          python3 .github/scripts/validate_repo.py --check-pairs

      - name: Preflight and stage all assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGE_ROOT: ${{ runner.temp }}/pica-stage
        run: |
          set -euo pipefail
          rm -rf "$STAGE_ROOT"
          python3 .github/scripts/fetch_assets.py --preflight \
            --stage-root "$STAGE_ROOT" \
            --plan-output "$STAGE_ROOT/plan.json" \
            ${{ steps.detect.outputs.packages }}

      - name: Build Staged Packages
        run: |
          set -euo pipefail
          mkdir -p build_output
          DIRS_TO_BUILD="${{ steps.detect.outputs.packages }}"
          STAGE_ROOT="${{ runner.temp }}/pica-stage"

          if [ -z "$DIRS_TO_BUILD" ]; then
            echo "No packages selected for rebuild."
            exit 0
          fi

          for dir in $DIRS_TO_BUILD; do
            PKG_MGR=$(basename "$(dirname "$dir")")
            PKG_ID=$(basename "$dir")
            STAGE="$STAGE_ROOT/$PKG_MGR/$PKG_ID"

            if [ ! -f "$STAGE/manifest" ]; then
              echo "error: preflight did not stage $dir at $STAGE" >&2
              exit 1
            fi

            echo "Building package in $STAGE..."
            pica-pack build "$STAGE" --outdir build_output
          done

      - name: Generate Repository Index
        run: |
          # Ensure r/ exists
          mkdir -p r
          # pica-pack writes one repo.json per backend under build_output/<backend>/.
          # gen_repo_index.py merges them into r/repo.json and copies artifacts
          # to r/packages/ where `pica -S` looks for them.
          if ls build_output/*/repo.json > /dev/null 2>&1; then
            python3 .github/scripts/gen_repo_index.py build_output/*/repo.json
          else
            echo "No packages were built."
          fi

      - name: Validate generated index
        run: python3 .github/scripts/validate_repo.py --quiet

      - name: Generate Release Tag
        id: date
        run: echo "RELEASE_TAG=$(date +'%y-%m-%d-%H-%M-%S')" >> $GITHUB_ENV

      - name: Create Snapshot Release
        uses: softprops/action-gh-release@v2
        if: success() && steps.detect.outputs.packages != '' && hashFiles('r/packages/*.pkg.tar.gz') != ''
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          files: r/packages/*.pkg.tar.gz

      - name: Update Rolling Latest Release
        uses: softprops/action-gh-release@v2
        if: success() && steps.detect.outputs.packages != '' && hashFiles('r/packages/*.pkg.tar.gz') != ''
        with:
          tag_name: latest
          name: Latest Packages
          files: r/packages/*.pkg.tar.gz

      - name: Commit generated index and artifacts
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # A workflow-only (or validation-only) run builds nothing, so
          # r/packages may not exist; `git add` on a missing path is fatal.
          git add r/repo.json
          if [ -d r/packages ]; then
            git add r/packages
          fi
          if git diff --staged --quiet; then
            echo "No changes to r/ to commit."
          else
            git commit -m "chore: auto-update r/repo.json and r/packages [skip ci]"
            git push origin "$GITHUB_REF_NAME"
          fi
